name: iOS Build & OTA Distribution

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build SyposMobile iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build Archive
        run: |
          cd ios
          xcodebuild clean archive \
            -project SyposMobile.xcodeproj \
            -scheme SyposMobile \
            -configuration Release \
            -archivePath build/SyposMobile.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package Payload to .IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/SyposMobile.xcarchive/Products/Applications/SyposMobile.app build/Payload/
          cd build
          zip -r SyposMobile.ipa Payload
          ls -lh SyposMobile.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyposMobile-iOS-IPA
          path: ios/build/SyposMobile.ipa

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.2
          name: SYPOS Mobile iOS v2.2
          draft: false
          prerelease: false
          files: ios/build/SyposMobile.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: iOS Build & OTA Distribution

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build SyposMobile iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Build iOS App
        run: |
          cd ios
          xcodebuild clean build \
            -project SyposMobile.xcodeproj \
            -scheme SyposMobile \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .IPA
        run: |
          cd ios
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "SyposMobile.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r SyposMobile.ipa Payload
          ls -lh SyposMobile.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyposMobile-iOS-IPA
          path: ios/build/SyposMobile.ipa

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.2
          name: SYPOS Mobile iOS v2.2
          draft: false
          prerelease: false
          files: ios/build/SyposMobile.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
